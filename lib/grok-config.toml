[cli]
installer = "internal"

[marketplace]
default_skills_installs_purged = true

[ui]
permission_mode = "always-approve"
max_thoughts_width = 120
fork_secondary_model = "grok-4.5"
yolo = false
compact_mode = false

[models]
default = "glm-5.2"
session_summary = "glm-5.2"
web_search = "glm-5.2"

[model."glm-5.2"]
model = "glm-5.2"
base_url = "${DASHSCOPE_BASE_URL}"
name = "GLM-5.2 (DashScope MaaS)"
description = "Zhipu GLM-5.2 via DashScope MaaS OpenAI-compatible endpoint"
api_backend = "chat_completions"
env_key = "DASHSCOPE_API_KEY"
context_window = 128000

