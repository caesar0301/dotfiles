# OpenAI Codex CLI configuration template
# Source: https://github.com/caesar0301/cool-dotfiles/lib/codex-config.toml
#
# This template is installed by lib/install-ai-agent-codex.sh into
# ~/.codex/config.toml when --dashscope is used.
#
# Codex does NOT interpolate ${VAR} in base_url at runtime — the installer
# substitutes ${DASHSCOPE_BASE_URL} with the actual URL at install time.
# Only env_key (the API key) is resolved from the environment at runtime.
#
# The DashScope MaaS endpoint supports the Responses API (/responses)
# directly, so no local bridge (aliyun-codex-bridge) is needed anymore.
# wire_api = "responses" is the only supported value in Codex >= 0.147.
#
# All models listed below are synced from lib/claude-code-router.json
# (dashscope provider). glm-5.2 is the default; the rest are selectable.
# To use a different one as default, change `model` at the top and point
# `model_provider` to the matching provider key.

model = "glm-5.2"
model_provider = "dashscope-glm"

# NOTE: Provider keys containing a dot (e.g. "dashscope-glm-5.2") MUST be
# quoted — otherwise TOML parses them as dotted keys and splits the table
# (e.g. dashscope-glm-5 -> 2), which leaves the real provider without a
# `name` and Codex rejects it with "provider name must not be empty".
# See: https://github.com/caesar0301/cool-dotfiles/lib/codex-config.toml

# --- GLM-5.2 (default; verified available on DashScope MaaS) ---
[model_providers.dashscope-glm]
name = "GLM-5.2 (DashScope MaaS)"
base_url = "${DASHSCOPE_BASE_URL}"
env_key = "DASHSCOPE_API_KEY"
wire_api = "responses"
stream_idle_timeout_ms = 3000000

